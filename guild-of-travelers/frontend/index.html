<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гильдия Путников — Таверна «Путь Героя»</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-tavern">
    <!-- Контейнер для частиц (пыль и искры в таверне) -->
<div id="particles" class="particles-container"></div>
    <div class="container">
        <header>
            <img src="images/guild-emblem.png" alt="Эмблема Гильдии" class="guild-logo">
            <h1>Гильдия Исследователей</h1>
            <p class="subtitle">Дворецкий приглашает тебя пройти в зал!</p>
        </header>

        <main>
            <div class="registration-form">
                <h2>Войди в зал, Путник</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="code">Твой код доступа:</label>
                        <input type="text" id="code" name="code" placeholder="Например: 8А02" required>
                        <small>Код выдал учитель (формат: 8А01, 11Б15 и т.д.)</small>
                    </div>

                    <div class="form-group">
                        <label for="heroName">Имя твоего героя:</label>
                        <input type="text" id="heroName" name="heroName" placeholder="Как тебя зовут в этом мире?" required>
                    </div>

                    <button type="submit" class="btn-primary">🗝️ Войти в зал </button>
                </form>
                <div id="errorMessage" class="error-message"></div>
            </div>
        </main>

        <footer>
            <p>Профориентационный квест в стиле D&D</p>
            <p>© 2026 Гильдия Путников</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
    <script src="js/effects.js"></script>
<script>
    // Тёплые искры от камина
    new AdvancedParticleSystem('particles', {
        count: 60,
        type: 'ember',
        color: 'rgba(255, 180, 80, 0.8)',
        speed: 1.5,
        size: 4
    });
    
    // Дополнительный слой - золотая пыль
    setTimeout(() => {
        const dustContainer = document.createElement('div');
        dustContainer.id = 'dust-particles';
        dustContainer.className = 'particles-container';
        dustContainer.style.zIndex = '0';
        document.body.appendChild(dustContainer);
        
        new AdvancedParticleSystem('dust-particles', {
            count: 30,
            type: 'sparkle',
            color: 'rgba(212, 175, 55, 0.4)',
            speed: 0.3,
            size: 2
        });
    }, 100);
</script>
</body>
</html>
